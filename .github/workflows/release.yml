name: Release Publish

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Derive release and next snapshot versions
        id: version
        run: |
          CURRENT_VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          if [[ "$CURRENT_VERSION" != *-SNAPSHOT ]]; then
            echo "gradle.properties version must end with -SNAPSHOT" >&2
            exit 1
          fi
          RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$RELEASE_VERSION"
          NEXT_PATCH=$((PATCH + 1))
          NEXT_SNAPSHOT="$MAJOR.$MINOR.$NEXT_PATCH-SNAPSHOT"
          echo "release=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT_SNAPSHOT" >> "$GITHUB_OUTPUT"

      - name: Set release version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("gradle.properties")
          current = path.read_text()
          path.write_text(current.replace(
              "version=${{ steps.version.outputs.release }}-SNAPSHOT",
              "version=${{ steps.version.outputs.release }}"
          ))
          PY

      - name: Commit release version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties
          git commit -m "Release v${{ steps.version.outputs.release }}"
          git push

      - name: Verify release build
        run: ./gradlew clean test jacocoTestReport check --no-daemon

      - name: Publish GitHub Packages and stage Central artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository publishAllPublicationsToJReleaserStagingRepository --no-daemon

      - name: Publish release to Sonatype Central with JReleaser
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew jreleaserDeploy --no-daemon

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.release }}"
          git push origin "v${{ steps.version.outputs.release }}"

      - name: Bump to next snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("gradle.properties")
          lines = []
          for line in path.read_text().splitlines():
              if line.startswith("version="):
                  lines.append("version=${{ steps.version.outputs.next }}")
              else:
                  lines.append(line)
          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Commit next snapshot version
        run: |
          git add gradle.properties
          git commit -m "Prepare next development iteration"
          git push
